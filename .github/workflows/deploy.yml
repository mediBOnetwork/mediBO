name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release

      - name: Stamp version.json
        run: |
          set -euo pipefail
          N=$(grep -o '"change"[^0-9]*[0-9]\+' web/version.json | grep -o '[0-9]\+' | tail -1)
          SHORT=$(git rev-parse --short HEAD)
          BUILT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > build/web/version.json <<JSON
          {"commit":"$SHORT","built":"$BUILT","change":"${N}"}
          JSON

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build/web --project-name=medibo --branch=main --commit-dirty=true
