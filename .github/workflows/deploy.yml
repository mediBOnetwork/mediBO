# CHANGE #472: disabled the push trigger. This workflow used to fire on every
# push to main (i.e. every ~deploy.sh run, since deploy.sh pushes as its last
# step) and run its OWN independent flutter build + wrangler upload a few
# minutes later — no fingerprinting, no boot-gate, no cache purge. It silently
# became the new Cloudflare Pages "production" deployment and measurably broke
# the live site (25-45% of requests serving wrong content) for 10-15+ minutes
# after every deploy. ~/deploy.sh already covers every deploy correctly on its
# own; this workflow is now manual-only (Actions tab -> Run workflow) so it
# can still be used deliberately without racing deploy.sh. See the
# concurrent-deploy-race memory for the full investigation.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release

      - name: Stamp version.json
        run: |
          set -euo pipefail
          N=$(grep -o '"change"[^0-9]*[0-9]\+' web/version.json | grep -o '[0-9]\+' | tail -1)
          SHORT=$(git rev-parse --short HEAD)
          BUILT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > build/web/version.json <<JSON
          {"commit":"$SHORT","built":"$BUILT","change":"${N}"}
          JSON

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build/web --project-name=medibo --branch=main --commit-dirty=true
