# mediBO web lane — build on `queue`, publish ONE commit to `main`.
#
# Why this shape: Cloudflare Pages is git-connected to this repo with automatic
# deployments on `main` and NO build command — it simply publishes whatever is
# committed at build/web. So a source-only push to main would publish the OLD
# build/web and serve stale content for minutes (that is CHANGE #472's bug).
#
# Therefore main is only ever moved by this workflow, and every commit it makes
# already carries the matching build/web. Source changes land on `queue`; this
# builds them and fast-forwards main with source + fresh build together, so
# Cloudflare publishes exactly once, with correct content.

name: Web — build queue and publish to main

on:
  push:
    branches: [queue]
  workflow_dispatch: {}

concurrency:
  group: medibo-web-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout queue
        uses: actions/checkout@v4
        with:
          ref: queue
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Protected tests (must pass)
        run: |
          set -euo pipefail
          if [ -d test/protected ]; then
            flutter test test/protected/
          else
            echo "no test/protected directory — skipping"
          fi

      - name: Build web (release)
        run: flutter build web --release

      - name: Stamp version.json
        run: |
          set -euo pipefail
          N="${GITHUB_RUN_NUMBER}"
          SHORT=$(git rev-parse --short HEAD)
          BUILT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"commit":"%s","built":"%s","change":"gha-%s"}\n' "$SHORT" "$BUILT" "$N" > build/web/version.json
          cp build/web/version.json web/version.json
          cat build/web/version.json

      - name: Keep the fresh build aside
        run: |
          set -euo pipefail
          rm -rf /tmp/webout
          cp -r build/web /tmp/webout

      - name: Publish source + build to main in one commit
        run: |
          set -euo pipefail
          git config user.name  "medibo-bot"
          git config user.email "bot@medibo.in"

          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits that queue does not contain. Refusing to publish."
            git log --oneline origin/main ^HEAD | head -20
            exit 1
          fi

          git checkout -B main HEAD
          rm -rf build/web
          cp -r /tmp/webout build/web

          git add -A
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          SUBJECT=$(git log -1 --pretty=%s queue)
          git commit -m "web: ${SUBJECT}" -m "Built by GitHub Actions run ${GITHUB_RUN_NUMBER}. build/web is the artifact Cloudflare Pages publishes."
          git push origin main

      - name: Report
        run: |
          echo "main is now $(git rev-parse --short main)"
          echo "Cloudflare Pages will publish build/web from this commit."
