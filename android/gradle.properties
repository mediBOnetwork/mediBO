# Sized for this VM. The Flutter template's -Xmx8G + HeapDumpOnOutOfMemoryError
# OOM-killed the Gradle daemon and dumped a multi-GB .hprof that filled the disk;
# capped here and heap-dump removed. Daemon off so no long-lived JVM lingers.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
