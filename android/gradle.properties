# Sized for this VM. The Flutter template's -Xmx8G + HeapDumpOnOutOfMemoryError
# OOM-killed the Gradle daemon and dumped a multi-GB .hprof that filled the disk;
# capped here and heap-dump removed. Daemon off so no long-lived JVM lingers.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Djava.io.tmpdir=/dev/shm/gtmp
org.gradle.daemon=false
android.useAndroidX=true
# compileSdk 36 (Android 16) is supported on AGP 8.9.x; silence the untested-API note.
android.suppressUnsupportedCompileSdk=36
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
