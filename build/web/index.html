  <!-- CHANGE #220: version-staleness check for installed PWA auto-update.
       On every load, fetches /version.json (no-cache). If the live commit differs
       from the build-stamped commit below, does ONE hard reload so the PWA gets the
       newest bundle instead of staying on a stale cached build.
       dd38323 is replaced with the actual short commit hash by deploy.sh. -->
  <script>
    (function () {
      var _builtCommit = 'dd38323';
      var _sessionKey  = 'c220_pwa_reloaded';
      function _rlWrite(key, val) {
        try {
          var el = document.getElementById('medibo-render-log');
          if (el) {
            var cur = {};
            try { cur = JSON.parse(el.getAttribute('data-log') || '{}'); } catch (_) {}
            cur[key] = val;
            el.setAttribute('data-log', JSON.stringify(cur));
          }
        } catch (_) {}
      }
      window.addEventListener('load', function () {
        try {
          // Already reloaded once this session — skip to prevent loop.
          if (sessionStorage.getItem(_sessionKey)) return;
          // Skip if placeholder was not stamped (local dev / test build).
          if (_builtCommit === 'dd38323') return;
          fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data && data.commit && data.commit !== _builtCommit) {
                // New build detected — reload once to pick it up.
                sessionStorage.setItem(_sessionKey, '1');
                _rlWrite('c220_sw_reloaded', 1);
                window.location.reload(true);
              }
            })
            .catch(function () {});
        } catch (_) {}
      });
      // Wire confirmation — written once regardless of outcome.
      window.addEventListener('DOMContentLoaded', function () {
        if (_builtCommit !== 'dd38323') {
          _rlWrite('c220_pwa_check_wired', 1);
        }
      });
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       ADMIN ALERT AUDIO  (Web Audio API — no file required)
       Called from Flutter via dart:js:
         adminAlertStart()  — start looping beep
         adminAlertStop()   — stop beep
         adminAlertMute(bool) — mute/unmute
       Also tries HTML Audio with the bundled WAV asset first.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var _ctx = null;
      var _toneInterval = null;
      var _muted = false;
      var _htmlAudio = null;

      function _getCtx() {
        if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
        return _ctx;
      }

      function _tone() {
        if (_muted) return;
        try {
          var ctx = _getCtx();
          if (ctx.state === 'suspended') ctx.resume();
          // Double pulse: 880 Hz then 1046 Hz
          [880, 1046].forEach(function (freq, idx) {
            var osc  = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            var t0 = ctx.currentTime + idx * 0.22;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(0.35, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.20);
            osc.start(t0);
            osc.stop(t0 + 0.22);
          });
        } catch (e) { /* ignore — browser may block */ }
      }

      function _tryHtmlAudio() {
        try {
          _htmlAudio = new Audio('assets/sounds/new_alert.mp3');
          _htmlAudio.loop   = true;
          _htmlAudio.volume = 0.65;
          var p = _htmlAudio.play();
          if (p instanceof Promise) {
            p.catch(function () {
              _htmlAudio = null;
              _tone(); // fallback: tone now, then schedule
              _toneInterval = setInterval(_tone, 2500);
            });
          }
          return true;
        } catch (e) { return false; }
      }

      window.adminAlertStart = function () {
        window.adminAlertStop(); // clear any existing
        _muted = false;
        if (!_tryHtmlAudio()) {
          _tone();
          _toneInterval = setInterval(_tone, 2500);
        }
      };

      window.adminAlertStop = function () {
        clearInterval(_toneInterval);
        _toneInterval = null;
        if (_htmlAudio) {
          try { _htmlAudio.pause(); _htmlAudio.currentTime = 0; } catch (_) {}
          _htmlAudio = null;
        }
      };

      window.adminAlertMute = function (m) {
        _muted = !!m;
        if (_htmlAudio) _htmlAudio.muted = _muted;
      };

      // ── ORDER ALERT AUDIO (distinct ascending arpeggio — triangle wave) ──
      var _orderHtmlAudio = null;
      var _orderToneInterval = null;

      function _orderTone() {
        if (_muted) return;
        try {
          var ctx = _getCtx();
          if (ctx.state === 'suspended') ctx.resume();
          // C5(523) → E5(659) → G5(784) ascending major arpeggio
          [523, 659, 784].forEach(function (freq, idx) {
            var osc  = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'triangle';
            var t0 = ctx.currentTime + idx * 0.14;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(0.4, t0 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
            osc.start(t0);
            osc.stop(t0 + 0.25);
          });
        } catch (e) {}
      }

      function _tryOrderHtmlAudio() {
        try {
          _orderHtmlAudio = new Audio('assets/sounds/order_alert.wav');
          _orderHtmlAudio.loop   = false;
          _orderHtmlAudio.volume = 0.7;
          var _replayOrder = function () {
            if (_orderHtmlAudio && !_muted) {
              _orderHtmlAudio.currentTime = 0;
              _orderHtmlAudio.play().catch(function () {});
            }
          };
          var p = _orderHtmlAudio.play();
          if (p instanceof Promise) {
            p.catch(function () {
              _orderHtmlAudio = null;
              _orderTone();
              _orderToneInterval = setInterval(_orderTone, 3500);
            });
          }
          _orderToneInterval = setInterval(_replayOrder, 3500);
          return true;
        } catch (e) { return false; }
      }

      window.adminOrderAlertStart = function () {
        window.adminOrderAlertStop();
        _muted = false;
        if (!_tryOrderHtmlAudio()) {
          _orderTone();
          _orderToneInterval = setInterval(_orderTone, 3500);
        }
      };

      window.adminOrderAlertStop = function () {
        clearInterval(_orderToneInterval);
        _orderToneInterval = null;
        if (_orderHtmlAudio) {
          try { _orderHtmlAudio.pause(); _orderHtmlAudio.currentTime = 0; } catch (_) {}
          _orderHtmlAudio = null;
        }
      };

      window.adminOrderAlertMute = function (m) {
        _muted = !!m;
        if (_orderHtmlAudio) _orderHtmlAudio.muted = _muted;
      };

      // Called from FcmService.dart to receive SW → window messages
      var _msgHandler = null;
      window.adminAlertRegisterMessageHandler = function (cb) {
        _msgHandler = cb;
      };
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'new_registration' && _msgHandler) {
          try { _msgHandler(event.data); } catch (_) {}
        }
        if (event.data && event.data.type === 'navigate_to_pending') {
          // SW notif click: ensure admin is showing Pending Registrations tab
          try { window.location.hash = '#/customers/pending'; } catch (_) {}
        }
      });
    })();
  </script>

  <!-- Firebase SDK — loaded lazily after page load so it doesn't block Flutter startup -->
  <script>
    (function () {
      var _fcmMessaging = null;
      var _fcmConfigured = false;

      var FIREBASE_CONFIG = {
        apiKey:            "REPLACE_WITH_FIREBASE_API_KEY",
        authDomain:        "REPLACE_WITH_PROJECT_ID.firebaseapp.com",
        projectId:         "REPLACE_WITH_PROJECT_ID",
        storageBucket:     "REPLACE_WITH_PROJECT_ID.appspot.com",
        messagingSenderId: "REPLACE_WITH_SENDER_ID",
        appId:             "REPLACE_WITH_APP_ID",
      };
      var VAPID_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY";
      _fcmConfigured = FIREBASE_CONFIG.apiKey !== "REPLACE_WITH_FIREBASE_API_KEY";

      if (!_fcmConfigured) {
        console.info('[FCM] Firebase credentials not configured — web push disabled.');
        window.fcmGetToken = function (cb) { cb(null); };
        return;
      }

      function loadScript(src, onload) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = onload;
        document.head.appendChild(s);
      }

      window.addEventListener('load', function () {
        loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js', function () {
          loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js', function () {
            try {
              var _fbApp = firebase.initializeApp(FIREBASE_CONFIG);
              _fcmMessaging = firebase.messaging(_fbApp);
            } catch (e) {
              console.warn('[FCM] Firebase init error:', e);
            }
          });
        });
      });

      window.fcmGetToken = function (callback) {
        if (!_fcmMessaging || !_fcmConfigured) { callback(null); return; }
        Notification.requestPermission().then(function (permission) {
          if (permission !== 'granted') { callback(null); return; }
          _fcmMessaging.getToken({ vapidKey: VAPID_KEY })
            .then(function (token) { callback(token || null); })
            .catch(function (e) { console.warn('[FCM] getToken error:', e); callback(null); });
        }).catch(function () { callback(null); });
      };
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       GOOGLE IDENTITY SERVICES (GIS) BRIDGE  — nonce-aware + FedCM
       Desktop ONLY: mediboGisSignIn(clientId, hashedNonce) → Promise<idToken string>
       • hashedNonce  = SHA-256 hex of the raw nonce (computed by Dart)
       • Resolves with the GIS credential (ID token JWT)
       • GIS embeds hashedNonce in the JWT nonce claim; Supabase verifies
         by re-hashing the raw nonce Dart passes to signInWithIdToken.
       • FedCM (use_fedcm_for_prompt + itp_support) enables cookie-free
         sign-in on mobile Chrome where third-party cookies are blocked.
       ═══════════════════════════════════════════════════════════════════════ -->
  <!-- GIS modal overlay — shown when Flutter calls mediboGisSignIn() -->
  <div id="gis-overlay"
       aria-modal="true"
       role="dialog"
       aria-label="Sign in with Google"
       style="display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);">
    <div style="background:#fff;border-radius:14px;padding:32px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 8px 40px rgba(0,0,0,0.22);min-width:300px;max-width:340px;width:90%;">
      <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:17px;font-weight:600;color:#111827;text-align:center;">Sign in with Google</p>
      <div id="gis-btn-container" style="min-height:44px;"></div>
      <button id="gis-cancel-btn"
              style="background:none;border:none;color:#6B7280;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;cursor:pointer;padding:6px 16px;border-radius:8px;">
        Cancel
      </button>
    </div>
  </div>

  <script>
    (function () {
      // mediboGisSignIn(clientId, hashedNonce)
      //   clientId    — Google OAuth web client ID
      //   hashedNonce — SHA-256 hex string of the raw nonce (Dart-computed)
      // Resolves with the GIS credential string (ID token JWT).
      // Rejects with 'dismissed' or 'gis-load-timeout'.
      window.mediboGisSignIn = function (clientId, hashedNonce) {
        return new Promise(function (resolve, reject) {
          var overlay   = document.getElementById('gis-overlay');
          var btnDiv    = document.getElementById('gis-btn-container');
          var cancelBtn = document.getElementById('gis-cancel-btn');
          var settled   = false;

          function settle(fn, val) {
            if (settled) return;
            settled = true;
            overlay.style.display = 'none';
            overlay.onclick = null;
            if (cancelBtn) cancelBtn.onclick = null;
            fn(val);
          }

          function onCancel() { settle(reject, 'dismissed'); }

          overlay.onclick = function (e) {
            if (e.target === overlay) onCancel();
          };
          if (cancelBtn) cancelBtn.onclick = onCancel;

          var attempts = 0;
          function tryInit() {
            if (settled) return;
            if (window.google && window.google.accounts && window.google.accounts.id) {
              btnDiv.innerHTML = '';

              // Pass the SHA-256 hex hash of rawNonce to GIS; GIS embeds it
              // verbatim in the JWT nonce claim. Supabase re-hashes rawNonce
              // and compares — they match iff we got the pairing right.
              // use_fedcm_for_prompt + itp_support: enable FedCM — the
              // browser-native credential flow that works on mobile Chrome
              // even when third-party cookies are blocked (no popup required).
              google.accounts.id.initialize({
                client_id:             clientId,
                nonce:                  hashedNonce,
                callback:              function (response) {
                  settle(resolve, response.credential);
                },
                use_fedcm_for_prompt:  true,
                itp_support:           true,
                auto_select:           false,
              });

              google.accounts.id.renderButton(btnDiv, {
                type:          'standard',
                shape:         'rectangular',
                theme:         'outline',
                text:          'signin_with',
                size:          'large',
                logo_alignment: 'left',
                width:         260,
              });

              overlay.style.display = 'flex';
            } else {
              attempts++;
              if (attempts > 60) {
                settle(reject, 'gis-load-timeout');
              } else {
                setTimeout(tryInit, 200);
              }
            }
          }

          tryInit();
        });
      };
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       VOICE RECEIVE — Web Speech API bridge
       mediboVoiceSupported : bool
       mediboVoiceStart(onInterim, onFinal, onError) — push-to-talk listen
       mediboVoiceStop()    — abort recognition
       mediboVoiceSpeak(text) — TTS echo
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      window.mediboVoiceSupported = !!SR;
      if (!SR) return;

      var _recognition = null;

      window.mediboVoiceStart = function (onInterim, onFinal, onError) {
        if (_recognition) { try { _recognition.abort(); } catch (e) {} }
        _recognition = new SR();
        _recognition.lang = 'en-IN';
        _recognition.interimResults = true;
        _recognition.continuous = false;
        _recognition.maxAlternatives = 1;
        var _gotFinal = false;

        _recognition.onresult = function (event) {
          for (var i = event.resultIndex; i < event.results.length; i++) {
            var t = event.results[i][0].transcript.trim();
            if (event.results[i].isFinal && !_gotFinal) {
              _gotFinal = true;
              onFinal(t);
            } else if (!event.results[i].isFinal) {
              onInterim(t);
            }
          }
        };

        _recognition.onerror = function (e) {
          if (e.error !== 'aborted') onError(e.error || 'unknown');
        };

        _recognition.onend = function () {
          if (!_gotFinal) onError('no-speech');
        };

        try { _recognition.start(); } catch (e) { onError('start-failed'); }
      };

      window.mediboVoiceStop = function () {
        if (_recognition) { try { _recognition.stop(); } catch (e) {} }
      };

      var _synth = window.speechSynthesis;
      window.mediboVoiceSpeak = function (text) {
        if (!_synth) return;
        _synth.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        u.rate = 1.0;
        _synth.speak(u);
      };

      // Async TTS — calls onDone when utterance ends or after 8s safety timeout.
      window.mediboVoiceSpeakAsync = function (text, onDone) {
        if (!_synth) { if (onDone) onDone(); return; }
        var done = false;
        function finish() { if (!done) { done = true; if (onDone) onDone(); } }
        var tid = setTimeout(finish, 8000);
        var voices = _synth.getVoices();
        function speak(voices) {
          var u = new SpeechSynthesisUtterance(text);
          u.voice = voices.find(function(v) { return v.lang === 'hi-IN'; })
                 || voices.find(function(v) { return v.lang && v.lang.startsWith('en-IN'); })
                 || null;
          u.lang = (u.voice && u.voice.lang) || 'hi-IN';
          u.rate = 1.0; u.pitch = 1.0;
          u.onend = function() { clearTimeout(tid); finish(); };
          u.onerror = function() { clearTimeout(tid); finish(); };
          _synth.cancel();
          _synth.speak(u);
        }
        if (voices.length === 0) {
          var vtid = setTimeout(function() { speak(_synth.getVoices()); }, 1000);
          _synth.addEventListener('voiceschanged', function() {
            clearTimeout(vtid); speak(_synth.getVoices());
          }, { once: true });
        } else {
          speak(voices);
        }
      };

      // #93: Loudness gate — decode audio bytes and compute RMS+peak via Web Audio.
      // Called from Dart before uploading a clip. Returns Promise<{rms, peak}>.
      // On any failure resolves with {rms:-1, peak:-1} so Dart falls open.
      // #94 FIX: decodeAudioData DETACHES the passed ArrayBuffer (Web Audio spec).
      // We must pass a COPY so the original Dart Uint8List buffer stays intact.
      // Also fully fail-open: any error → {rms:1,peak:1} so the upload always proceeds.
      window.mediboCheckLoudness = function(uint8Array) {
        return new Promise(function(resolve) {
          try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            // slice(0) creates an independent copy — original is never detached
            var bufCopy = uint8Array.buffer.slice(0);
            ctx.decodeAudioData(bufCopy, function(audioBuffer) {
              try {
                var nCh = audioBuffer.numberOfChannels;
                var sumSq = 0, peak = 0, count = 0;
                for (var ch = 0; ch < nCh; ch++) {
                  var data = audioBuffer.getChannelData(ch);
                  for (var i = 0; i < data.length; i += 4) {
                    var s = data[i];
                    sumSq += s * s;
                    var abs = s < 0 ? -s : s;
                    if (abs > peak) peak = abs;
                    count++;
                  }
                }
                var rms = count > 0 ? Math.sqrt(sumSq / count) : 0;
                ctx.close();
                resolve({rms: rms, peak: peak, ok: true});
              } catch(e2) { resolve({rms: 1, peak: 1, ok: false}); }
            }, function() { resolve({rms: 1, peak: 1, ok: false}); });
          } catch(e) { resolve({rms: 1, peak: 1, ok: false}); }
        });
      };
    })();
  </script>
