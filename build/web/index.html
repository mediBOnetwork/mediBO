  <!-- CHANGE #220: version-staleness check for installed PWA auto-update.
       On every load, fetches /version.json (no-cache). If the live commit differs
       from the build-stamped commit below, does ONE hard reload so the PWA gets the
       newest bundle instead of staying on a stale cached build.
       4f77cf8f is replaced with the actual short commit hash by deploy.sh. -->
  <script>
    (function () {
      var _builtCommit = '4f77cf8f';
      var _sessionKey  = 'c220_pwa_reloaded';
      function _rlWrite(key, val) {
        try {
          var el = document.getElementById('medibo-render-log');
          if (el) {
            var cur = {};
            try { cur = JSON.parse(el.getAttribute('data-log') || '{}'); } catch (_) {}
            cur[key] = val;
            el.setAttribute('data-log', JSON.stringify(cur));
          }
        } catch (_) {}
      }
      window.addEventListener('load', function () {
        try {
          // Already reloaded once this session — skip to prevent loop.
          if (sessionStorage.getItem(_sessionKey)) return;
          // Skip if placeholder was not stamped (local dev / test build).
          if (_builtCommit === '4f77cf8f') return;
          fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data && data.commit && data.commit !== _builtCommit) {
                // New build detected — reload once to pick it up.
                sessionStorage.setItem(_sessionKey, '1');
                _rlWrite('c220_sw_reloaded', 1);
                window.location.reload(true);
              }
            })
            .catch(function () {});
        } catch (_) {}
      });
      // Wire confirmation — written once regardless of outcome.
      window.addEventListener('DOMContentLoaded', function () {
        if (_builtCommit !== '4f77cf8f') {
          _rlWrite('c220_pwa_check_wired', 1);
        }
      });
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       CHANGE #559 — NAVIGATION INSTRUMENTATION (diagnostic only, changes nothing)
       Loaded before recaptcha/GIS/Maps and before Flutter, so every hook is in
       place before any of them can move the browser.

       The question it answers: the Supabase auth log shows ZERO /authorize
       requests during a failed "Continue with Google", so something is sending
       the browser to accounts.google.com WITHOUT going through Supabase. This
       records the exact URL of every navigation the page can see:

         window.open(...)                  -> url_launcher_web uses this for
                                              supabase.auth.signInWithOAuth
                                              (window.open(url,'_self')), and
                                              GIS uses it for its popup
         Navigation API 'navigate'         -> location.href / assign / replace /
                                              link clicks / form submits.
                                              location.* is [Unforgeable] and
                                              CANNOT be monkey-patched, so this
                                              is the only way to see an href
                                              assignment
         document click (capture)          -> anchors, incl. programmatic
                                              a.click()
         form submit (event + .submit())   -> self-posting forms
         pagehide / beforeunload           -> the page left WITHOUT any of the
                                              above firing => the navigation
                                              came from browser-drawn UI (FedCM)
                                              or from inside a cross-origin GIS
                                              iframe

       Everything is written to the render-log key c559_url via the
       render_log_note RPC with keepalive:true, so the write survives the very
       navigation it is reporting.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var SUPA = 'https://swojhmarmaijkshsbeih.supabase.co';
      var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3b2pobWFybWFpamtzaHNiZWloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5Nzc2NjAsImV4cCI6MjA5NTU1MzY2MH0.KREJQV_VLVwZqHmDA96qt-Bi0naUkuSPo4uyLyur7xQ';
      var LSKEY = 'medibo_nav_log';
      var log = {};
      var flushTimer = null;

      function buildHash() {
        try {
          var m = document.querySelector('meta[name="build-commit"]');
          if (m && m.content) return m.content;
        } catch (e) {}
        return '';
      }

      // Mirror into localStorage + the hidden render-log node so the evidence
      // survives even if the network write is lost.
      function mirror() {
        try { window.localStorage.setItem(LSKEY, JSON.stringify(log)); } catch (e) {}
        try {
          var el = document.getElementById('medibo-render-log');
          if (el) {
            var cur = {};
            try { cur = JSON.parse(el.getAttribute('data-log') || '{}'); } catch (_) {}
            for (var k in log) cur[k] = log[k];
            el.setAttribute('data-log', JSON.stringify(cur));
          }
        } catch (e) {}
      }

      // keepalive:true — the request completes even though the page is being
      // navigated away. Without it the URL we are chasing would never be
      // recorded, because recording it is the last thing this page ever does.
      // render_log_note MERGES keys (SECURITY DEFINER), so it works while
      // signed out — render_log's own RLS only allows `authenticated` writes,
      // which is why login-screen diagnostics have always come back empty.
      function push() {
        try {
          fetch(SUPA + '/rest/v1/rpc/render_log_note', {
            method: 'POST',
            keepalive: true,
            headers: {
              'apikey': ANON,
              'Authorization': 'Bearer ' + ANON,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ p_build: buildHash(), p_data: log }),
          }).catch(function () {});
        } catch (e) {}
      }

      function note(k, v, urgent) {
        try { log[k] = String(v).slice(0, 900); } catch (e) { return; }
        mirror();
        if (urgent) { push(); return; }
        try {
          if (flushTimer) clearTimeout(flushTimer);
          flushTimer = setTimeout(push, 700);
        } catch (e) { push(); }
      }

      window.mediboNote = note;
      window.mediboNoteFlush = push;

      var urls = [];
      function record(kind, url, extra) {
        var line = kind + ' ' + (url || '(none)') + (extra ? ' [' + extra + ']' : '');
        urls.push(line);
        if (urls.length > 4) urls.shift();
        note('c559_url', line, true);
        note('c559_url_all', urls.join(' ;; '), true);
      }

      // ── 1. window.open ────────────────────────────────────────────────────
      try {
        var _open = window.open;
        window.open = function (u, n) {
          try { record('window.open', String(u), String(n || '')); } catch (e) {}
          return _open.apply(window, arguments);
        };
      } catch (e) {}

      // ── 2. Navigation API (location.href / assign / replace / links) ──────
      try {
        if (window.navigation && window.navigation.addEventListener) {
          note('c559_navapi', 'yes');
          window.navigation.addEventListener('navigate', function (ev) {
            try {
              var d = ev.destination ? ev.destination.url : '';
              // Ignore Flutter's own in-app route pushes (#/... on our origin).
              if (d && d.indexOf(location.origin) === 0) return;
              record('navigate', d);
            } catch (e) {}
          });
        } else {
          note('c559_navapi', 'no');
        }
      } catch (e) {}

      // ── 3. Anchor clicks, including programmatic a.click() ────────────────
      try {
        document.addEventListener('click', function (ev) {
          try {
            var n = ev.target;
            var hops = 0;
            while (n && n !== document && hops++ < 20) {
              if (n.tagName === 'A' && n.href) {
                record('a.click', n.href, n.target || '');
                return;
              }
              n = n.parentNode;
            }
          } catch (e) {}
        }, true);
      } catch (e) {}

      // ── 4. Form submits ───────────────────────────────────────────────────
      try {
        document.addEventListener('submit', function (ev) {
          try { record('form submit', (ev.target && ev.target.action) || ''); } catch (e) {}
        }, true);
        var _submit = HTMLFormElement.prototype.submit;
        HTMLFormElement.prototype.submit = function () {
          try { record('form.submit()', this.action || ''); } catch (e) {}
          return _submit.apply(this, arguments);
        };
      } catch (e) {}

      // ── 5. The page left anyway ───────────────────────────────────────────
      // If c559_unload fires with no c559_url, the navigation did NOT come from
      // this document: it came from browser-drawn FedCM UI or from inside a
      // cross-origin GIS iframe. That is itself the answer.
      try {
        window.addEventListener('pagehide', function () {
          note('c559_unload', 'pagehide from ' + location.href, true);
        }, true);
        window.addEventListener('beforeunload', function () {
          note('c559_unload', 'beforeunload from ' + location.href, true);
        }, true);
        document.addEventListener('visibilitychange', function () {
          note('c559_vis', document.visibilityState + '@' +
            Math.round((window.performance && performance.now()) || 0) + 'ms');
        }, true);
      } catch (e) {}

      // ── 6. FedCM — is the browser's own chooser taking over? ──────────────
      try {
        if (navigator.credentials && navigator.credentials.get) {
          var _credGet = navigator.credentials.get.bind(navigator.credentials);
          navigator.credentials.get = function (opts) {
            var cfg = '';
            try { cfg = opts.identity.providers[0].configURL; } catch (e) {}
            note('c559_fedcm', 'get(' + cfg + ')', true);
            var p = _credGet(opts);
            try {
              p.then(function (c) {
                note('c559_fedcm', 'resolved:' +
                  (c ? ((c.token || c.id_token) ? 'token' : 'no-token') : 'null'), true);
              }, function (e) {
                note('c559_fedcm', 'rejected:' + ((e && e.name) || e) + ':' +
                  ((e && e.message) || ''), true);
              });
            } catch (e) {}
            return p;
          };
        }
      } catch (e) {}

      // ── 7. GIS tripwire ───────────────────────────────────────────────────
      // CHANGE #561 removed the GIS library, so the expected result here is now
      // c559_gis=absent-after-20s. This block stays as a permanent tripwire: if
      // anything ever re-introduces GIS, c559_gis flips back to `loaded` and the
      // wrappers name whichever method got called. It only READS
      // window.google.accounts.id to detect it — it never calls into GIS.
      // (The Maps JS API also defines window.google, but not .accounts, so it
      // cannot trip this.)
      var gisWrapped = false;
      function wrapGis() {
        if (gisWrapped) return true;
        if (!(window.google && window.google.accounts && window.google.accounts.id)) return false;
        gisWrapped = true;
        note('c559_gis', 'loaded', true);
        var id = window.google.accounts.id;
        ['initialize', 'prompt', 'renderButton'].forEach(function (fn) {
          try {
            var orig = id[fn];
            if (typeof orig !== 'function') return;
            id[fn] = function () {
              try {
                note('c559_gis_' + fn, 'called@' +
                  Math.round((window.performance && performance.now()) || 0) + 'ms', true);
                if (fn === 'renderButton') note('c559_path_js', 'gis_button', true);
              } catch (e) {}
              return orig.apply(id, arguments);
            };
          } catch (e) {}
        });
        return true;
      }
      var gisTries = 0;
      (function pollGis() {
        try {
          if (wrapGis()) return;
          if (++gisTries > 100) { note('c559_gis', 'absent-after-20s'); return; }
          setTimeout(pollGis, 200);
        } catch (e) {}
      })();

      // ── 8. GIS iframes — proves GIS activity even inside a cross-origin frame
      try {
        var frames = 0;
        new MutationObserver(function (recs) {
          try {
            for (var i = 0; i < recs.length; i++) {
              var added = recs[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                var n = added[j];
                if (!n || n.tagName !== 'IFRAME') continue;
                var src = n.src || '';
                if (src.indexOf('accounts.google.com') < 0) continue;
                frames++;
                note('c559_gis_iframe', 'n=' + frames + ' ' + src.slice(0, 260));
              }
            }
          } catch (e) {}
        }).observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {}

      // ── 9. Where did this page load from / return to? ─────────────────────
      try {
        note('c559_boot', location.href.slice(0, 400) +
          ' std=' + (!!(window.matchMedia &&
            window.matchMedia('(display-mode: standalone)').matches)));
      } catch (e) {}
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       ADMIN ALERT AUDIO  (Web Audio API — no file required)
       Called from Flutter via dart:js:
         adminAlertStart()  — start looping beep
         adminAlertStop()   — stop beep
         adminAlertMute(bool) — mute/unmute
       Also tries HTML Audio with the bundled WAV asset first.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var _ctx = null;
      var _toneInterval = null;
      var _muted = false;
      var _htmlAudio = null;

      function _getCtx() {
        if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
        return _ctx;
      }

      function _tone() {
        if (_muted) return;
        try {
          var ctx = _getCtx();
          if (ctx.state === 'suspended') ctx.resume();
          // Double pulse: 880 Hz then 1046 Hz
          [880, 1046].forEach(function (freq, idx) {
            var osc  = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            var t0 = ctx.currentTime + idx * 0.22;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(0.35, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.20);
            osc.start(t0);
            osc.stop(t0 + 0.22);
          });
        } catch (e) { /* ignore — browser may block */ }
      }

      function _tryHtmlAudio() {
        try {
          _htmlAudio = new Audio('assets/sounds/new_alert.mp3');
          _htmlAudio.loop   = true;
          _htmlAudio.volume = 0.65;
          var p = _htmlAudio.play();
          if (p instanceof Promise) {
            p.catch(function () {
              _htmlAudio = null;
              _tone(); // fallback: tone now, then schedule
              _toneInterval = setInterval(_tone, 2500);
            });
          }
          return true;
        } catch (e) { return false; }
      }

      window.adminAlertStart = function () {
        window.adminAlertStop(); // clear any existing
        _muted = false;
        if (!_tryHtmlAudio()) {
          _tone();
          _toneInterval = setInterval(_tone, 2500);
        }
      };

      window.adminAlertStop = function () {
        clearInterval(_toneInterval);
        _toneInterval = null;
        if (_htmlAudio) {
          try { _htmlAudio.pause(); _htmlAudio.currentTime = 0; } catch (_) {}
          _htmlAudio = null;
        }
      };

      window.adminAlertMute = function (m) {
        _muted = !!m;
        if (_htmlAudio) _htmlAudio.muted = _muted;
      };

      // ── ORDER ALERT AUDIO (distinct ascending arpeggio — triangle wave) ──
      var _orderHtmlAudio = null;
      var _orderToneInterval = null;

      function _orderTone() {
        if (_muted) return;
        try {
          var ctx = _getCtx();
          if (ctx.state === 'suspended') ctx.resume();
          // C5(523) → E5(659) → G5(784) ascending major arpeggio
          [523, 659, 784].forEach(function (freq, idx) {
            var osc  = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'triangle';
            var t0 = ctx.currentTime + idx * 0.14;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(0.4, t0 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
            osc.start(t0);
            osc.stop(t0 + 0.25);
          });
        } catch (e) {}
      }

      function _tryOrderHtmlAudio() {
        try {
          _orderHtmlAudio = new Audio('assets/sounds/order_alert.wav');
          _orderHtmlAudio.loop   = false;
          _orderHtmlAudio.volume = 0.7;
          var _replayOrder = function () {
            if (_orderHtmlAudio && !_muted) {
              _orderHtmlAudio.currentTime = 0;
              _orderHtmlAudio.play().catch(function () {});
            }
          };
          var p = _orderHtmlAudio.play();
          if (p instanceof Promise) {
            p.catch(function () {
              _orderHtmlAudio = null;
              _orderTone();
              _orderToneInterval = setInterval(_orderTone, 3500);
            });
          }
          _orderToneInterval = setInterval(_replayOrder, 3500);
          return true;
        } catch (e) { return false; }
      }

      window.adminOrderAlertStart = function () {
        window.adminOrderAlertStop();
        _muted = false;
        if (!_tryOrderHtmlAudio()) {
          _orderTone();
          _orderToneInterval = setInterval(_orderTone, 3500);
        }
      };

      window.adminOrderAlertStop = function () {
        clearInterval(_orderToneInterval);
        _orderToneInterval = null;
        if (_orderHtmlAudio) {
          try { _orderHtmlAudio.pause(); _orderHtmlAudio.currentTime = 0; } catch (_) {}
          _orderHtmlAudio = null;
        }
      };

      window.adminOrderAlertMute = function (m) {
        _muted = !!m;

  <!-- ── SPLASH WATCHDOG — auto-recovers from a corrupt/stale bundle ────────
       If Flutter has not signalled first-frame within 12 s, the page:
         1. Unregisters all service workers
         2. Clears all caches
         3. Reloads ONCE (sessionStorage 'mb_recovered' prevents infinite loops)
       Shares the same guard key as c220 pwa-check to prevent double-reload.
  ──────────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var WATCHDOG_KEY = 'mb_recovered';
      var WATCHDOG_MS  = 12000;
      var _painted     = false;

      // Flutter signals first-frame by writing boot_status=painted to render-log.
      // We poll for that element's content; also accept the engineInitialized signal.
      function _isBooted() {
        try {
          var rl = document.getElementById('medibo-render-log');
          if (rl && rl.innerText && rl.innerText.indexOf('boot_status=painted') !== -1) return true;
          if (window._flutterFirstFrame) return true;
        } catch (_) {}
        return false;
      }

      // Called by flutter_bootstrap onEntrypointLoaded hook (belt-and-suspenders).
      window._mbMarkFirstFrame = function () { _painted = true; };

      function _recover() {
        if (_painted || _isBooted()) return;
        if (sessionStorage.getItem(WATCHDOG_KEY)) return; // already tried once this session
        sessionStorage.setItem(WATCHDOG_KEY, '1');
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (names) {
              names.forEach(function (n) { caches.delete(n); });
            }).catch(function () {});
          }
        } catch (_) {}
        window.location.reload(true);
      }

      setTimeout(function () {
        if (!_painted && !_isBooted()) _recover();
      }, WATCHDOG_MS);

      // Poll every 500ms so we stop the watchdog as soon as flutter paints
      var _poll = setInterval(function () {
        if (_isBooted()) { _painted = true; clearInterval(_poll); }
      }, 500);
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       GOOGLE SIGN-IN BRIDGE — CHANGE #562 (GIS One Tap, restored)

       WHY THIS IS BACK: the Supabase auth log holds exactly four successful
       Google logins, all grant_type=id_token, all on the pre-#557 build that
       used GIS One Tap. Since #557 replaced it with FedCM there has not been a
       single successful Google login — navigator.credentials.get has never
       worked on this deployment. #561's instrumentation showed the last attempt
       leaving the page with no c559_url at all: the FedCM call was still
       in flight (c559_fedcm=get(...), never resolved/rejected) when browser-
       drawn UI took the page to accounts.google.com.

       This is a straight mechanism swap. FedCM is gone; One Tap is back.

       mediboGisPrewarm(clientId, hashedNonce)  -> loads GIS + initialize() ONCE
       mediboGisPromptNow()                     -> One Tap sheet, SYNCHRONOUS
       mediboLastGisError()                     -> why the last attempt failed
       mediboIsStandalone()                     -> true when installed as a PWA

       WHY PREWARM: google.accounts.id.prompt() needs the caller's transient
       user activation. Without prewarm the tap path is tap -> Dart -> JS ->
       *poll for the GIS library* -> initialize() -> prompt(), and every async
       hop throws the activation away, so Chrome refuses to display the sheet.
       The library is loaded and initialize()d during screen mount instead, so
       the tap path is a single synchronous prompt().

       NOT RESTORED, DELIBERATELY: google.accounts.id.renderButton() and the
       #gis-rb-overlay sheet that hosted it. That button is what hands control
       to GIS to build its own accounts.google.com URL — the URL that never hits
       Supabase's /authorize and that Google rejects with "response_type
       missing". It also added DOM. One Tap draws its own sheet; nothing here
       renders any markup of ours. On One Tap unavailable/dismissed the caller
       falls back to supabase.auth.signInWithOAuth.

       NOTE: with use_fedcm_for_prompt:true the PromptMomentNotification methods
       isDisplayed/isNotDisplayed/getNotDisplayedReason/isSkippedMoment are NOT
       supported and THROW, so every probe is individually guarded. CHANGE
       #310c's warning still stands — the notification callback may never fire
       after a FedCM dismissal — so prompt() also carries a hard timeout and can
       never leave the caller's button spinning.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var _ready       = false;   // initialize() has run
      var _initFailed  = false;
      var _pending     = null;    // {resolve, reject} awaiting a credential
      var _clientId    = null;
      var _hashedNonce = null;

      window.mediboIsStandalone = function () {
        try {
          if (window.navigator && window.navigator.standalone === true) return true;
          return !!(window.matchMedia &&
            (window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches ||
             window.matchMedia('(display-mode: minimal-ui)').matches));
        } catch (e) { return false; }
      };

      function gisReady() {
        return !!(window.google && window.google.accounts && window.google.accounts.id);
      }

      window.mediboLastGisError = function () {
        try {
          return String(window.mediboGisMoment || '');
        } catch (e) { return ''; }
      };

      function deliver(resp) {
        var p = _pending;
        _pending = null;
        if (!p) return;
        if (resp && resp.credential) p.resolve(resp.credential);
        // CHANGE #563: an empty callback must not navigate either.
        else p.reject('suppressed');
      }

      // ── Prewarm: load GIS and initialize() once, well before any tap ───────
      window.mediboGisPrewarm = function (clientId, hashedNonce) {
        return new Promise(function (resolve) {
          if (_ready && _clientId === clientId && _hashedNonce === hashedNonce) {
            resolve('ready');
            return;
          }
          _clientId = clientId;
          _hashedNonce = hashedNonce;
          var attempts = 0;
          function poll() {
            if (!gisReady()) {
              if (++attempts > 40) { _initFailed = true; resolve('no-library'); return; }
              setTimeout(poll, 150);
              return;
            }
            try {
              // CHANGE #563: cancel_on_tap_outside MUST stay false. With it
              // true, a tap anywhere outside the sheet counts as a dismissal
              // and feeds Google's exponential cooldown, after which prompt()
              // stops displaying entirely.
              google.accounts.id.initialize({
                client_id: clientId,
                nonce: hashedNonce,
                callback: deliver,
                use_fedcm_for_prompt: true,
                itp_support: true,
                context: 'signin',
                auto_select: false,
                cancel_on_tap_outside: false,
              });
              _ready = true;
              _initFailed = false;
              resolve('ready');
            } catch (e) {
              _initFailed = true;
              resolve('init-error');
            }
          }
          poll();
        });
      };

      // ── CHANGE #563: called on logout, so the next sign-in always shows the
      // chooser instead of silently reusing the last account. ───────────────
      window.mediboGisDisableAutoSelect = function () {
        try {
          if (!gisReady()) return false;
          google.accounts.id.disableAutoSelect();
          return true;
        } catch (e) { return false; }
      };

      // ── One Tap: called SYNCHRONOUSLY from the tap handler ────────────────
      window.mediboGisPromptNow = function () {
        return new Promise(function (resolve, reject) {
          var settled = false;
          var timer = null;

          function settle(fn, val) {
            if (settled) return;
            settled = true;
            if (timer) { clearTimeout(timer); timer = null; }
            if (_pending && _pending.tag === tag) _pending = null;
            fn(val);
          }
          var tag = Math.random();

          // CHANGE #563: never 'fallback' — a missing library must not send
          // the browser to Google on its own either.
          if (!_ready || _initFailed || !gisReady()) {
            try { window.mediboNote && window.mediboNote('c563_moment', 'library_not_ready', true); } catch (e) {}
            reject('suppressed');
            return;
          }

          _pending = {
            tag: tag,
            resolve: function (c) { settle(resolve, c); },
            reject: function (r) { settle(reject, r); },
          };

          function probe(n, name) {
            try { return !!(n[name] && n[name]()); } catch (e) { return false; }
          }
          function reason(n, name) {
            try { return (n[name] ? String(n[name]()) : '') || ''; } catch (e) { return ''; }
          }
          function moment(v) {
            try { window.mediboGisMoment = v; } catch (e) {}
            try { window.mediboNote && window.mediboNote('c563_moment', v, true); } catch (e) {}
          }

          try {
            google.accounts.id.prompt(function (n) {
              if (settled || !n) return;

              // CHANGE #563: suppressed by Google (cooldown, no session, FedCM
              // refusal). This must NOT navigate anywhere — the caller shows an
              // inline note and a link, and only a deliberate tap on that link
              // may open the browser chooser.
              if (probe(n, 'isNotDisplayed')) {
                moment('not_displayed:' + (reason(n, 'getNotDisplayedReason') || 'unknown'));
                settle(reject, 'suppressed');
                return;
              }
              if (probe(n, 'isSkippedMoment')) {
                moment('skipped:' + (reason(n, 'getSkippedReason') || 'unknown'));
                settle(reject, 'suppressed');
                return;
              }
              if (probe(n, 'isDisplayed') || probe(n, 'isDisplayMoment')) {
                moment('displayed');
                return; // the sheet is up; wait for the credential or a dismissal
              }
              if (probe(n, 'isDismissedMoment')) {
                var r = reason(n, 'getDismissedReason') || 'unknown';
                moment('dismissed:' + r);
                // The credential arrives through the initialize() callback.
                if (r === 'credential_returned') return;
                // A deliberate close is an answer, not a failure: the caller
                // stays on the login screen and re-enables the button.
                settle(reject, 'cancelled');
              }
            });
          } catch (e) {
            moment('prompt_threw');
            settle(reject, 'suppressed');
            return;
          }

          // CHANGE #310c: the moment callback can go silent after a FedCM
          // dismissal — never let that hang the caller. CHANGE #563: a silent
          // callback resolves to 'suppressed', not a navigation.
          timer = setTimeout(function () {
            try { window.mediboNote && window.mediboNote('c563_moment', 'no_moment_timeout', true); } catch (e) {}
            settle(reject, 'suppressed');
          }, 90000);
        });
      };
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       VOICE RECEIVE — Web Speech API bridge
       mediboVoiceSupported : bool
       mediboVoiceStart(onInterim, onFinal, onError) — push-to-talk listen
       mediboVoiceStop()    — abort recognition
       mediboVoiceSpeak(text) — TTS echo
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      window.mediboVoiceSupported = !!SR;
      if (!SR) return;

      var _recognition = null;

      window.mediboVoiceStart = function (onInterim, onFinal, onError) {
        if (_recognition) { try { _recognition.abort(); } catch (e) {} }
        _recognition = new SR();
        _recognition.lang = 'en-IN';
        _recognition.interimResults = true;
        _recognition.continuous = false;
        _recognition.maxAlternatives = 1;
        var _gotFinal = false;

        _recognition.onresult = function (event) {
          for (var i = event.resultIndex; i < event.results.length; i++) {
            var t = event.results[i][0].transcript.trim();
            if (event.results[i].isFinal && !_gotFinal) {
              _gotFinal = true;
              onFinal(t);
            } else if (!event.results[i].isFinal) {
              onInterim(t);
            }
          }
        };

        _recognition.onerror = function (e) {
          if (e.error !== 'aborted') onError(e.error || 'unknown');
        };

        _recognition.onend = function () {
          if (!_gotFinal) onError('no-speech');
        };

        try { _recognition.start(); } catch (e) { onError('start-failed'); }
      };

      window.mediboVoiceStop = function () {
        if (_recognition) { try { _recognition.stop(); } catch (e) {} }
      };

      var _synth = window.speechSynthesis;
      window.mediboVoiceSpeak = function (text) {
        if (!_synth) return;
        _synth.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        u.rate = 1.0;
        _synth.speak(u);
      };

      // Async TTS — calls onDone when utterance ends or after 8s safety timeout.
      window.mediboVoiceSpeakAsync = function (text, onDone) {
        if (!_synth) { if (onDone) onDone(); return; }
        var done = false;
        function finish() { if (!done) { done = true; if (onDone) onDone(); } }
        var tid = setTimeout(finish, 8000);
        var voices = _synth.getVoices();
        function speak(voices) {
          var u = new SpeechSynthesisUtterance(text);
          u.voice = voices.find(function(v) { return v.lang === 'hi-IN'; })
                 || voices.find(function(v) { return v.lang && v.lang.startsWith('en-IN'); })
                 || null;
          u.lang = (u.voice && u.voice.lang) || 'hi-IN';
          u.rate = 1.0; u.pitch = 1.0;
          u.onend = function() { clearTimeout(tid); finish(); };
          u.onerror = function() { clearTimeout(tid); finish(); };
          _synth.cancel();
          _synth.speak(u);
        }
        if (voices.length === 0) {
          var vtid = setTimeout(function() { speak(_synth.getVoices()); }, 1000);
          _synth.addEventListener('voiceschanged', function() {
            clearTimeout(vtid); speak(_synth.getVoices());
          }, { once: true });
        } else {
          speak(voices);
        }
      };

      // #93: Loudness gate — decode audio bytes and compute RMS+peak via Web Audio.
      // Called from Dart before uploading a clip. Returns Promise<{rms, peak}>.
      // On any failure resolves with {rms:-1, peak:-1} so Dart falls open.
      // #94 FIX: decodeAudioData DETACHES the passed ArrayBuffer (Web Audio spec).
      // We must pass a COPY so the original Dart Uint8List buffer stays intact.
      // Also fully fail-open: any error → {rms:1,peak:1} so the upload always proceeds.
      window.mediboCheckLoudness = function(uint8Array) {
        return new Promise(function(resolve) {
          try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            // slice(0) creates an independent copy — original is never detached
            var bufCopy = uint8Array.buffer.slice(0);
            ctx.decodeAudioData(bufCopy, function(audioBuffer) {
              try {
                var nCh = audioBuffer.numberOfChannels;
                var sumSq = 0, peak = 0, count = 0;
                for (var ch = 0; ch < nCh; ch++) {
                  var data = audioBuffer.getChannelData(ch);
                  for (var i = 0; i < data.length; i += 4) {
                    var s = data[i];
                    sumSq += s * s;
                    var abs = s < 0 ? -s : s;
                    if (abs > peak) peak = abs;
                    count++;
                  }
                }
                var rms = count > 0 ? Math.sqrt(sumSq / count) : 0;
                ctx.close();
                resolve({rms: rms, peak: peak, ok: true});
              } catch(e2) { resolve({rms: 1, peak: 1, ok: false}); }
            }, function() { resolve({rms: 1, peak: 1, ok: false}); });
          } catch(e) { resolve({rms: 1, peak: 1, ok: false}); }
        });
      };
    })();
  </script>

  <!-- CHANGE #237: reload once when a new SW activates (kill-SW triggers controllerchange). -->
  <!-- c409_sw_autoupdate: also force an immediate update check on any pre-existing SW
       registration on every load, instead of waiting for the browser's background
       (~24h) check — so a returning tab with an old SW discovers + installs the
       kill-SW right away rather than staying stale until a hard refresh. Never
       calls register() itself: this app intentionally registers no new SW. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (window.__reloadedForSW) return;
        window.__reloadedForSW = true;
        window.location.reload();
      });
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update().catch(function () {});
      }).catch(function () {});
    }
  </script>
