  <!-- CHANGE #220: version-staleness check for installed PWA auto-update.
       On every load, fetches /version.json (no-cache). If the live commit differs
       from the build-stamped commit below, does ONE hard reload so the PWA gets the
       newest bundle instead of staying on a stale cached build.
       f4ef4c79 is replaced with the actual short commit hash by deploy.sh. -->
  <script>
    (function () {
      var _builtCommit = 'f4ef4c79';
      var _sessionKey  = 'c220_pwa_reloaded';
      function _rlWrite(key, val) {
        try {
          var el = document.getElementById('medibo-render-log');
          if (el) {
            var cur = {};
            try { cur = JSON.parse(el.getAttribute('data-log') || '{}'); } catch (_) {}
            cur[key] = val;
            el.setAttribute('data-log', JSON.stringify(cur));
          }
        } catch (_) {}
      }
      window.addEventListener('load', function () {
        try {
          // Already reloaded once this session — skip to prevent loop.
          if (sessionStorage.getItem(_sessionKey)) return;
          // Skip if placeholder was not stamped (local dev / test build).
          if (_builtCommit === 'f4ef4c79') return;
          fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data && data.commit && data.commit !== _builtCommit) {
                // New build detected — reload once to pick it up.
                sessionStorage.setItem(_sessionKey, '1');
                _rlWrite('c220_sw_reloaded', 1);
                window.location.reload(true);
              }
            })
            .catch(function () {});
        } catch (_) {}
      });
      // Wire confirmation — written once regardless of outcome.
      window.addEventListener('DOMContentLoaded', function () {
        if (_builtCommit !== 'f4ef4c79') {
          _rlWrite('c220_pwa_check_wired', 1);
        }
      });
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       ADMIN ALERT AUDIO  (Web Audio API — no file required)
       Called from Flutter via dart:js:
         adminAlertStart()  — start looping beep
         adminAlertStop()   — stop beep
         adminAlertMute(bool) — mute/unmute
       Also tries HTML Audio with the bundled WAV asset first.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var _ctx = null;
      var _toneInterval = null;
      var _muted = false;
      var _htmlAudio = null;

      function _getCtx() {
        if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
        return _ctx;
      }

      function _tone() {
        if (_muted) return;
        try {
          var ctx = _getCtx();
          if (ctx.state === 'suspended') ctx.resume();
          // Double pulse: 880 Hz then 1046 Hz
          [880, 1046].forEach(function (freq, idx) {
            var osc  = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            var t0 = ctx.currentTime + idx * 0.22;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(0.35, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.20);
            osc.start(t0);
            osc.stop(t0 + 0.22);
          });
        } catch (e) { /* ignore — browser may block */ }
      }

      function _tryHtmlAudio() {
        try {
          _htmlAudio = new Audio('assets/sounds/new_alert.mp3');
          _htmlAudio.loop   = true;
          _htmlAudio.volume = 0.65;
          var p = _htmlAudio.play();
          if (p instanceof Promise) {
            p.catch(function () {
              _htmlAudio = null;
              _tone(); // fallback: tone now, then schedule
              _toneInterval = setInterval(_tone, 2500);
            });
          }
          return true;
        } catch (e) { return false; }
      }

      window.adminAlertStart = function () {
        window.adminAlertStop(); // clear any existing
        _muted = false;
        if (!_tryHtmlAudio()) {
          _tone();
          _toneInterval = setInterval(_tone, 2500);
        }
      };

      window.adminAlertStop = function () {
        clearInterval(_toneInterval);
        _toneInterval = null;
        if (_htmlAudio) {
          try { _htmlAudio.pause(); _htmlAudio.currentTime = 0; } catch (_) {}
          _htmlAudio = null;
        }
      };

      window.adminAlertMute = function (m) {
        _muted = !!m;
        if (_htmlAudio) _htmlAudio.muted = _muted;
      };

      // ── ORDER ALERT AUDIO (distinct ascending arpeggio — triangle wave) ──
      var _orderHtmlAudio = null;
      var _orderToneInterval = null;

      function _orderTone() {
        if (_muted) return;
        try {
          var ctx = _getCtx();
          if (ctx.state === 'suspended') ctx.resume();
          // C5(523) → E5(659) → G5(784) ascending major arpeggio
          [523, 659, 784].forEach(function (freq, idx) {
            var osc  = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'triangle';
            var t0 = ctx.currentTime + idx * 0.14;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(0.4, t0 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
            osc.start(t0);
            osc.stop(t0 + 0.25);
          });
        } catch (e) {}
      }

      function _tryOrderHtmlAudio() {
        try {
          _orderHtmlAudio = new Audio('assets/sounds/order_alert.wav');
          _orderHtmlAudio.loop   = false;
          _orderHtmlAudio.volume = 0.7;
          var _replayOrder = function () {
            if (_orderHtmlAudio && !_muted) {
              _orderHtmlAudio.currentTime = 0;
              _orderHtmlAudio.play().catch(function () {});
            }
          };
          var p = _orderHtmlAudio.play();
          if (p instanceof Promise) {
            p.catch(function () {
              _orderHtmlAudio = null;
              _orderTone();
              _orderToneInterval = setInterval(_orderTone, 3500);
            });
          }
          _orderToneInterval = setInterval(_replayOrder, 3500);
          return true;
        } catch (e) { return false; }
      }

      window.adminOrderAlertStart = function () {
        window.adminOrderAlertStop();
        _muted = false;
        if (!_tryOrderHtmlAudio()) {
          _orderTone();
          _orderToneInterval = setInterval(_orderTone, 3500);
        }
      };

      window.adminOrderAlertStop = function () {
        clearInterval(_orderToneInterval);
        _orderToneInterval = null;
        if (_orderHtmlAudio) {
          try { _orderHtmlAudio.pause(); _orderHtmlAudio.currentTime = 0; } catch (_) {}
          _orderHtmlAudio = null;
        }
      };

      window.adminOrderAlertMute = function (m) {
        _muted = !!m;
        if (_orderHtmlAudio) _orderHtmlAudio.muted = _muted;
      };

      // Called from FcmService.dart to receive SW → window messages
      var _msgHandler = null;
      window.adminAlertRegisterMessageHandler = function (cb) {
        _msgHandler = cb;
      };
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'new_registration' && _msgHandler) {
          try { _msgHandler(event.data); } catch (_) {}
        }
        if (event.data && event.data.type === 'navigate_to_pending') {
          // SW notif click: ensure admin is showing Pending Registrations tab
          try { window.location.hash = '#/customers/pending'; } catch (_) {}
        }
      });
    })();
  </script>

  <!-- ── SPLASH WATCHDOG — auto-recovers from a corrupt/stale bundle ────────
       If Flutter has not signalled first-frame within 12 s, the page:
         1. Unregisters all service workers
         2. Clears all caches
         3. Reloads ONCE (sessionStorage 'mb_recovered' prevents infinite loops)
       Shares the same guard key as c220 pwa-check to prevent double-reload.
  ──────────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var WATCHDOG_KEY = 'mb_recovered';
      var WATCHDOG_MS  = 12000;
      var _painted     = false;

      // Flutter signals first-frame by writing boot_status=painted to render-log.
      // We poll for that element's content; also accept the engineInitialized signal.
      function _isBooted() {
        try {
          var rl = document.getElementById('medibo-render-log');
          if (rl && rl.innerText && rl.innerText.indexOf('boot_status=painted') !== -1) return true;
          if (window._flutterFirstFrame) return true;
        } catch (_) {}
        return false;
      }

      // Called by flutter_bootstrap onEntrypointLoaded hook (belt-and-suspenders).
      window._mbMarkFirstFrame = function () { _painted = true; };

      function _recover() {
        if (_painted || _isBooted()) return;
        if (sessionStorage.getItem(WATCHDOG_KEY)) return; // already tried once this session
        sessionStorage.setItem(WATCHDOG_KEY, '1');
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (names) {
              names.forEach(function (n) { caches.delete(n); });
            }).catch(function () {});
          }
        } catch (_) {}
        window.location.reload(true);
      }

      setTimeout(function () {
        if (!_painted && !_isBooted()) _recover();
      }, WATCHDOG_MS);

      // Poll every 500ms so we stop the watchdog as soon as flutter paints
      var _poll = setInterval(function () {
        if (_isBooted()) { _painted = true; clearInterval(_poll); }
      }, 500);
    })();
  </script>

  <!-- Firebase SDK — loaded lazily after page load so it doesn't block Flutter startup -->
  <script>
    (function () {
      var _fcmMessaging = null;
      var _fcmConfigured = false;

      var FIREBASE_CONFIG = {
        apiKey:            "REPLACE_WITH_FIREBASE_API_KEY",
        authDomain:        "REPLACE_WITH_PROJECT_ID.firebaseapp.com",
        projectId:         "REPLACE_WITH_PROJECT_ID",
        storageBucket:     "REPLACE_WITH_PROJECT_ID.appspot.com",
        messagingSenderId: "REPLACE_WITH_SENDER_ID",
        appId:             "REPLACE_WITH_APP_ID",
      };
      var VAPID_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY";
      _fcmConfigured = FIREBASE_CONFIG.apiKey !== "REPLACE_WITH_FIREBASE_API_KEY";

      if (!_fcmConfigured) {
        console.info('[FCM] Firebase credentials not configured — web push disabled.');
        window.fcmGetToken = function (cb) { cb(null); };
        return;
      }

      function loadScript(src, onload) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = onload;
        document.head.appendChild(s);
      }

      window.addEventListener('load', function () {
        loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js', function () {
          loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js', function () {
            try {
              var _fbApp = firebase.initializeApp(FIREBASE_CONFIG);
              _fcmMessaging = firebase.messaging(_fbApp);
            } catch (e) {
              console.warn('[FCM] Firebase init error:', e);
            }
          });
        });
      });

      window.fcmGetToken = function (callback) {
        if (!_fcmMessaging || !_fcmConfigured) { callback(null); return; }
        Notification.requestPermission().then(function (permission) {
          if (permission !== 'granted') { callback(null); return; }
          _fcmMessaging.getToken({ vapidKey: VAPID_KEY })
            .then(function (token) { callback(token || null); })
            .catch(function (e) { console.warn('[FCM] getToken error:', e); callback(null); });
        }).catch(function () { callback(null); });
      };
    })();
  </script>

       Always uses renderButton() — never prompt()/FedCM.
       prompt() is unreliable on mobile: its notification callback may not fire
       after FedCM dismissal, leaving the JS promise hanging and _busy stuck true.
       renderButton() always shows a tappable Google button; callback fires reliably.

  <!-- CHANGE #556: this is now a HALF-SCREEN BOTTOM SHEET, not a centre modal.
       In an installed PWA a centre popup still reads as a browser dialog; a
       bottom sheet matches the native Google account picker. All copy is set
       from Dart (backend strings) via mediboGisSheet(), never hardcoded here. -->
  <style>

    #gis-rb-panel { animation: mediboSheetUp 260ms cubic-bezier(.22,.61,.36,1); }

  </style>
  <div id="gis-rb-overlay"
       style="display:none;position:fixed;inset:0;z-index:99998;
              align-items:flex-end;justify-content:center;
              background:rgba(0,0,0,0.45);">
    <div id="gis-rb-panel"
         style="background:#fff;border-radius:22px 22px 0 0;
                padding:10px 24px calc(28px + env(safe-area-inset-bottom));
                display:flex;flex-direction:column;align-items:center;gap:14px;

      <p id="gis-rb-title"

         style="margin:-6px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

           style="min-height:44px;width:100%;display:flex;justify-content:center;

      <button id="gis-rb-cancel"
              style="background:none;border:none;color:#6B7280;cursor:pointer;
                     font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                     font-size:14px;padding:10px 24px;border-radius:8px;margin-top:auto;">

  <!-- ═══════════════════════════════════════════════════════════════════════
       GOOGLE IDENTITY SERVICES BRIDGE — CHANGE #556
       Rewritten so an installed PWA never has to leave the app to sign in.

       mediboGisPrewarm(clientId, hashedNonce)  -> loads GIS + initialize() ONCE
       mediboGisPromptNow()                     -> One Tap sheet, SYNCHRONOUS
       mediboGisSheet(title, subtitle, cancel)  -> our own half-screen sheet
       mediboIsStandalone()                     -> true when installed as a PWA
       mediboGisSignIn(clientId, hashedNonce)   -> legacy entry (home_shell)

       WHY PREWARM: google.accounts.id.prompt() needs the caller's transient
       user activation. Previously the tap went tap -> Dart -> JS -> *poll for
       the GIS library* -> initialize() -> prompt(), and every one of those
       async hops threw the activation away, so Chrome refused to display the
       sheet and we silently fell back to a full-page OAuth redirect — which in
       a PWA opens browser chrome. Now the library is loaded and initialize()d
       during screen mount, so the tap path is a single synchronous prompt().

       NOTE: with use_fedcm_for_prompt:true the PromptMomentNotification
       methods isDisplayed/isNotDisplayed/getNotDisplayedReason/isSkippedMoment
       are NOT supported and THROW, so every probe is individually guarded.
       CHANGE #310c's warning still stands — the notification callback may never
       fire after a FedCM dismissal — so prompt() also carries a hard timeout
       and can never leave the caller's button spinning.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var _ready       = false;   // initialize() has run
      var _initFailed  = false;
      var _pending     = null;    // {resolve, reject} awaiting a credential
      var _clientId    = null;
      var _hashedNonce = null;

      window.mediboIsStandalone = function () {
        try {
          if (window.navigator && window.navigator.standalone === true) return true;
          return !!(window.matchMedia &&
            (window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches ||
             window.matchMedia('(display-mode: minimal-ui)').matches));
        } catch (e) { return false; }
      };

      function gisReady() {
        return !!(window.google && window.google.accounts && window.google.accounts.id);
      }

      // ── CHANGE #557: the browser's native FedCM account chooser ────────────
      // google.accounts.id.prompt() carries Google's OWN suppression: once a
      // user has dismissed One Tap a few times it stops displaying, and there
      // is no way to clear that from the page. CHANGE #556 shipped and the
      // render-log confirmed exactly that — prewarm=ready, one_tap=unavailable.
      //
      // navigator.credentials.get() with mediation:'required' asks the browser
      // directly instead of going through One Tap. It ALWAYS shows the account
      // chooser (never auto-selects), it lists EVERY Google account signed in
      // on the device, and it is not subject to the One Tap cooldown. The
      // chooser is drawn by the browser over the page, so an installed PWA is
      // never navigated anywhere.
      //
      // mode:'active' (Chrome 132+) is the gesture-driven modal chooser. On
      // older Chrome the member is simply ignored (unknown dictionary members
      // are dropped per WebIDL), leaving the passive sheet — still correct.
      window.mediboFedcmError = '';

      window.mediboFedcmGet = function (clientId, hashedNonce) {
        return new Promise(function (resolve, reject) {
          var supported = false;
          try {
            supported = !!(window.IdentityCredential &&
                           navigator.credentials && navigator.credentials.get);
          } catch (e) { supported = false; }
          if (!supported) {
            window.mediboFedcmError = 'unsupported';
            reject('fallback');
            return;
          }

          var opts = {
            identity: {
              context: 'signin',
              mode: 'active',
              providers: [{
                configURL: 'https://accounts.google.com/gsi/fedcm.json',
                clientId: clientId,
                nonce: hashedNonce,
              }],
            },
            mediation: 'required',
          };

          var done = false;
          var timer = setTimeout(function () {
            if (done) return;
            done = true;
            window.mediboFedcmError = 'timeout';
            reject('fallback');
          }, 120000);

          navigator.credentials.get(opts).then(function (cred) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            var t = cred && (cred.token || cred.id_token);
            if (t) { window.mediboFedcmError = ''; resolve(t); }
            else { window.mediboFedcmError = 'empty-credential'; reject('fallback'); }
          }).catch(function (err) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            var name = (err && err.name) ? err.name : String(err);
            var msg  = (err && err.message) ? err.message : '';
            window.mediboFedcmError = name + (msg ? ':' + msg : '');
            // The user closing the chooser must NOT cascade into a popup.
            if (name === 'AbortError' || name === 'NetworkError' ||
                name === 'IdentityCredentialError') {
              reject('cancelled');
            } else {
              reject('fallback');
            }
          });
        });
      };

      window.mediboLastGisError = function () {
        try {
          return String(window.mediboFedcmError || '') +
                 '|' + String(window.mediboGisMoment || '');
        } catch (e) { return ''; }
      };

      function deliver(resp) {
        var p = _pending;
        _pending = null;
        if (!p) return;
        if (resp && resp.credential) p.resolve(resp.credential);
        else p.reject('fallback');
      }

      // ── Prewarm: load GIS and initialize() once, well before any tap ───────
      window.mediboGisPrewarm = function (clientId, hashedNonce) {
        return new Promise(function (resolve) {
          if (_ready && _clientId === clientId && _hashedNonce === hashedNonce) {
            resolve('ready');
            return;
          }
          _clientId = clientId;
          _hashedNonce = hashedNonce;
          var attempts = 0;
          function poll() {
            if (!gisReady()) {
              if (++attempts > 40) { _initFailed = true; resolve('no-library'); return; }
              setTimeout(poll, 150);
              return;
            }
            try {
              google.accounts.id.initialize({
                client_id: clientId,
                nonce: hashedNonce,
                callback: deliver,
                use_fedcm_for_prompt: true,
                itp_support: true,
                context: 'signin',
                auto_select: false,
                cancel_on_tap_outside: true,
              });
              _ready = true;
              _initFailed = false;
              resolve('ready');
            } catch (e) {
              _initFailed = true;
              resolve('init-error');
            }
          }
          poll();
        });
      };

      // ── One Tap: called SYNCHRONOUSLY from the tap handler ────────────────
      window.mediboGisPromptNow = function () {
        return new Promise(function (resolve, reject) {
          var settled = false;
          var timer = null;

          function settle(fn, val) {
            if (settled) return;
            settled = true;
            if (timer) { clearTimeout(timer); timer = null; }
            if (_pending && _pending.tag === tag) _pending = null;
            fn(val);
          }
          var tag = Math.random();

          if (!_ready || _initFailed || !gisReady()) { reject('fallback'); return; }

          _pending = {
            tag: tag,
            resolve: function (c) { settle(resolve, c); },
            reject: function (r) { settle(reject, r); },
          };

          function probe(n, name) {
            try { return !!(n[name] && n[name]()); } catch (e) { return false; }
          }

          try {
            google.accounts.id.prompt(function (n) {
              if (settled || !n) return;
              if (probe(n, 'isNotDisplayed') || probe(n, 'isSkippedMoment')) {
                try { window.mediboGisMoment = 'not-displayed'; } catch (e) {}
                settle(reject, 'fallback');
                return;
              }
              if (probe(n, 'isDismissedMoment')) {
                var reason = '';
                try { reason = n.getDismissedReason ? n.getDismissedReason() : ''; } catch (e) {}
                try { window.mediboGisMoment = 'dismissed:' + reason; } catch (e) {}
                // The credential arrives through the initialize() callback.
                if (reason === 'credential_returned') return;
                settle(reject, 'cancelled');
              }
            });
          } catch (e) {
            settle(reject, 'fallback');
            return;
          }

          // CHANGE #310c: the moment callback can go silent after a FedCM
          // dismissal — never let that hang the caller.
          timer = setTimeout(function () { settle(reject, 'fallback'); }, 90000);
        });
      };

      // ── Our own half-screen sheet, hosting the GIS button ─────────────────
      // Used only when One Tap could not be displayed. ux_mode stays 'popup'
      // (the GIS default) so an installed PWA is never navigated away: the
      // popup closes itself and the credential lands back in this document.
      function showSheet(title, subtitle, cancelLabel, onCancel) {
        var ov  = document.getElementById('gis-rb-overlay');
        var ctr = document.getElementById('gis-rb-container');
        var btn = document.getElementById('gis-rb-cancel');
        var ttl = document.getElementById('gis-rb-title');
        var sub = document.getElementById('gis-rb-subtitle');
        if (!ov || !ctr || !btn) return false;

        if (ttl) { ttl.textContent = title || ''; ttl.style.display = title ? '' : 'none'; }
        if (sub) { sub.textContent = subtitle || ''; sub.style.display = subtitle ? '' : 'none'; }
        btn.textContent = cancelLabel || '';
        btn.style.display = cancelLabel ? '' : 'none';

        ctr.innerHTML = '';
        try {
          google.accounts.id.renderButton(ctr, {
            type: 'standard', shape: 'pill', theme: 'outline',
            text: 'continue_with', size: 'large', logo_alignment: 'left', width: 280,
          });
        } catch (e) { return false; }

        ov.style.display = 'flex';
        // CHANGE #399: swallow the touch-originated ghost click that lands on
        // the freshly-shown backdrop a few hundred ms after the opening tap.
        var openedAt = Date.now();
        var GRACE_MS = 400;
        btn.onclick = function () {
          if (Date.now() - openedAt < GRACE_MS) return;
          onCancel();
        };
        ov.onclick = function (ev) {
          if (Date.now() - openedAt < GRACE_MS) return;
          if (ev.target === ov) onCancel();
        };
        return true;
      }

      function hideSheet() {
        var ov = document.getElementById('gis-rb-overlay');
        if (ov) { ov.style.display = 'none'; ov.onclick = null; }
        var btn = document.getElementById('gis-rb-cancel');
        if (btn) btn.onclick = null;
      }

      window.mediboGisSheet = function (title, subtitle, cancelLabel) {
        return new Promise(function (resolve, reject) {
          var settled = false;
          var timer = null;
          var tag = Math.random();

          function settle(fn, val) {
            if (settled) return;
            settled = true;
            if (timer) { clearTimeout(timer); timer = null; }
            if (_pending && _pending.tag === tag) _pending = null;
            hideSheet();
            fn(val);
          }

          if (!_ready || !gisReady()) { reject('fallback'); return; }

          _pending = {
            tag: tag,
            resolve: function (c) { settle(resolve, c); },
            reject: function (r) { settle(reject, r); },
          };

          if (!showSheet(title, subtitle, cancelLabel, function () {
            settle(reject, 'cancelled');
          })) {
            _pending = null;
            reject('fallback');
            return;
          }

          timer = setTimeout(function () { settle(reject, 'cancelled'); }, 90000);
        });
      };

      // ── Legacy entry point, still used by home_shell ───────────────────────
      window.mediboGisSignIn = function (clientId, hashedNonce) {
        return window.mediboGisPrewarm(clientId, hashedNonce).then(function (st) {
          if (st !== 'ready') throw 'gis-load-timeout';
          return window.mediboGisSheet('', '', '');
        });
      };
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════════
       VOICE RECEIVE — Web Speech API bridge
       mediboVoiceSupported : bool
       mediboVoiceStart(onInterim, onFinal, onError) — push-to-talk listen
       mediboVoiceStop()    — abort recognition
       mediboVoiceSpeak(text) — TTS echo
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      window.mediboVoiceSupported = !!SR;
      if (!SR) return;

      var _recognition = null;

      window.mediboVoiceStart = function (onInterim, onFinal, onError) {
        if (_recognition) { try { _recognition.abort(); } catch (e) {} }
        _recognition = new SR();
        _recognition.lang = 'en-IN';
        _recognition.interimResults = true;
        _recognition.continuous = false;
        _recognition.maxAlternatives = 1;
        var _gotFinal = false;

        _recognition.onresult = function (event) {
          for (var i = event.resultIndex; i < event.results.length; i++) {
            var t = event.results[i][0].transcript.trim();
            if (event.results[i].isFinal && !_gotFinal) {
              _gotFinal = true;
              onFinal(t);
            } else if (!event.results[i].isFinal) {
              onInterim(t);
            }
          }
        };

        _recognition.onerror = function (e) {
          if (e.error !== 'aborted') onError(e.error || 'unknown');
        };

        _recognition.onend = function () {
          if (!_gotFinal) onError('no-speech');
        };

        try { _recognition.start(); } catch (e) { onError('start-failed'); }
      };

      window.mediboVoiceStop = function () {
        if (_recognition) { try { _recognition.stop(); } catch (e) {} }
      };

      var _synth = window.speechSynthesis;
      window.mediboVoiceSpeak = function (text) {
        if (!_synth) return;
        _synth.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        u.rate = 1.0;
        _synth.speak(u);
      };

      // Async TTS — calls onDone when utterance ends or after 8s safety timeout.
      window.mediboVoiceSpeakAsync = function (text, onDone) {
        if (!_synth) { if (onDone) onDone(); return; }
        var done = false;
        function finish() { if (!done) { done = true; if (onDone) onDone(); } }
        var tid = setTimeout(finish, 8000);
        var voices = _synth.getVoices();
        function speak(voices) {
          var u = new SpeechSynthesisUtterance(text);
          u.voice = voices.find(function(v) { return v.lang === 'hi-IN'; })
                 || voices.find(function(v) { return v.lang && v.lang.startsWith('en-IN'); })
                 || null;
          u.lang = (u.voice && u.voice.lang) || 'hi-IN';
          u.rate = 1.0; u.pitch = 1.0;
          u.onend = function() { clearTimeout(tid); finish(); };
          u.onerror = function() { clearTimeout(tid); finish(); };
          _synth.cancel();
          _synth.speak(u);
        }
        if (voices.length === 0) {
          var vtid = setTimeout(function() { speak(_synth.getVoices()); }, 1000);
          _synth.addEventListener('voiceschanged', function() {
            clearTimeout(vtid); speak(_synth.getVoices());
          }, { once: true });
        } else {
          speak(voices);
        }
      };

      // #93: Loudness gate — decode audio bytes and compute RMS+peak via Web Audio.
      // Called from Dart before uploading a clip. Returns Promise<{rms, peak}>.
      // On any failure resolves with {rms:-1, peak:-1} so Dart falls open.
      // #94 FIX: decodeAudioData DETACHES the passed ArrayBuffer (Web Audio spec).
      // We must pass a COPY so the original Dart Uint8List buffer stays intact.
      // Also fully fail-open: any error → {rms:1,peak:1} so the upload always proceeds.
      window.mediboCheckLoudness = function(uint8Array) {
        return new Promise(function(resolve) {
          try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            // slice(0) creates an independent copy — original is never detached
            var bufCopy = uint8Array.buffer.slice(0);
            ctx.decodeAudioData(bufCopy, function(audioBuffer) {
              try {
                var nCh = audioBuffer.numberOfChannels;
                var sumSq = 0, peak = 0, count = 0;
                for (var ch = 0; ch < nCh; ch++) {
                  var data = audioBuffer.getChannelData(ch);
                  for (var i = 0; i < data.length; i += 4) {
                    var s = data[i];
                    sumSq += s * s;
                    var abs = s < 0 ? -s : s;
                    if (abs > peak) peak = abs;
                    count++;
                  }
                }
                var rms = count > 0 ? Math.sqrt(sumSq / count) : 0;
                ctx.close();
                resolve({rms: rms, peak: peak, ok: true});
              } catch(e2) { resolve({rms: 1, peak: 1, ok: false}); }
            }, function() { resolve({rms: 1, peak: 1, ok: false}); });
          } catch(e) { resolve({rms: 1, peak: 1, ok: false}); }
        });
      };
    })();
  </script>

  <!-- CHANGE #237: reload once when a new SW activates (kill-SW triggers controllerchange). -->
  <!-- c409_sw_autoupdate: also force an immediate update check on any pre-existing SW
       registration on every load, instead of waiting for the browser's background
       (~24h) check — so a returning tab with an old SW discovers + installs the
       kill-SW right away rather than staying stale until a hard refresh. Never
       calls register() itself: this app intentionally registers no new SW. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (window.__reloadedForSW) return;
        window.__reloadedForSW = true;
        window.location.reload();
      });
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update().catch(function () {});
      }).catch(function () {});
    }
  </script>
